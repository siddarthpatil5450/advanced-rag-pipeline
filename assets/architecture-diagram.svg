<svg width="1200" height="627" viewBox="0 0 1200 627" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050b1a"/>
      <stop offset="55%" stop-color="#081a3a"/>
      <stop offset="100%" stop-color="#0a1f4a"/>
    </linearGradient>
    <linearGradient id="edgeGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e0ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00e0ff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#00e0ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="chipFace" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#132a52"/>
      <stop offset="100%" stop-color="#0c1d3d"/>
    </linearGradient>
    <linearGradient id="greenFace" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#123a26"/>
      <stop offset="100%" stop-color="#0b241a"/>
    </linearGradient>
    <linearGradient id="amberFace" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3d2c10"/>
      <stop offset="100%" stop-color="#28190a"/>
    </linearGradient>

    <marker id="arrowC" markerWidth="9" markerHeight="9" refX="6" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#4fd6ff"/>
    </marker>
    <marker id="arrowG" markerWidth="9" markerHeight="9" refX="6" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#5be08a"/>
    </marker>

    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>

    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M0,0 L0,42 M0,0 L42,0" stroke="#1c3a66" stroke-width="0.6" opacity="0.35"/>
    </pattern>
  </defs>

  <!-- Base -->
  <rect width="1200" height="627" fill="url(#bg)"/>
  <rect width="1200" height="627" fill="url(#grid)"/>

  <!-- Ambient glow orbs -->
  <circle cx="1080" cy="90" r="160" fill="#00e0ff" opacity="0.06" filter="url(#softGlow)"/>
  <circle cx="120" cy="560" r="180" fill="#5be08a" opacity="0.05" filter="url(#softGlow)"/>

  <!-- Top accent line -->
  <rect x="0" y="0" width="1200" height="3" fill="url(#edgeGlow)"/>

  <!-- Header -->
  <text x="56" y="70" font-family="'Segoe UI', Arial, sans-serif" font-size="38" font-weight="800" fill="#f2f8ff" letter-spacing="0.3">ADVANCED RAG PIPELINE</text>
  <text x="58" y="97" font-family="'Consolas', 'SF Mono', monospace" font-size="14" fill="#6fd8ff" letter-spacing="1.4">DOCUMENT Q&amp;A &#183; TEXT-TO-SQL &#183; ON-DEVICE INFERENCE</text>

  <!-- Badge: 0% cloud -->
  <g filter="url(#glow)">
    <rect x="988" y="34" width="156" height="34" rx="17" fill="#04121f" stroke="#00e0ff" stroke-width="1.4"/>
  </g>
  <rect x="988" y="34" width="156" height="34" rx="17" fill="#04121f" stroke="#00e0ff" stroke-width="1.4"/>
  <circle cx="1008" cy="51" r="4" fill="#00ffb0"/>
  <text x="1022" y="56" font-family="'Consolas', monospace" font-size="13" font-weight="700" fill="#c9fff0" letter-spacing="0.8">0% CLOUD CALLS</text>

  <line x1="56" y1="118" x2="1144" y2="118" stroke="#1c3a66" stroke-width="1"/>

  <!-- ===================== MAIN FLOW (left, ~76%) ===================== -->
  <g font-family="'Segoe UI', Arial, sans-serif">

    <!-- Node: Documents -->
    <rect x="56" y="158" width="176" height="72" rx="12" fill="url(#chipFace)" stroke="#2f6ec2" stroke-width="1.6"/>
    <rect x="56" y="158" width="176" height="72" rx="12" fill="none" stroke="#4fd6ff" stroke-width="0.6" opacity="0.5"/>
    <!-- doc icon -->
    <path d="M74 174 h20 l8 8 v24 h-28 z" fill="none" stroke="#7fc9ff" stroke-width="1.6"/>
    <path d="M94 174 v8 h8" fill="none" stroke="#7fc9ff" stroke-width="1.6"/>
    <text x="112" y="184" font-size="15.5" font-weight="700" fill="#eaf5ff">Your Documents</text>
    <text x="112" y="202" font-size="11.5" fill="#8fb8e0" font-family="'Consolas',monospace">PDF &#183; DOCX &#183; XLSX</text>
    <text x="112" y="216" font-size="11.5" fill="#8fb8e0" font-family="'Consolas',monospace">SCREENSHOTS &#183; PHOTOS</text>

    <line x1="232" y1="194" x2="248" y2="194" stroke="#4fd6ff" stroke-width="2.2" marker-end="url(#arrowC)"/>

    <!-- Node: OCR + Chunk + Embed -->
    <rect x="250" y="158" width="210" height="72" rx="12" fill="url(#chipFace)" stroke="#2f6ec2" stroke-width="1.6"/>
    <circle cx="271" cy="180" r="9" fill="none" stroke="#7fc9ff" stroke-width="1.6"/>
    <path d="M266 180 h10 M271 175 v10" stroke="#7fc9ff" stroke-width="1.4"/>
    <text x="287" y="182" font-size="14.5" font-weight="700" fill="#eaf5ff">OCR &#183; Chunk &#183; Embed</text>
    <text x="287" y="200" font-size="11" fill="#8fb8e0" font-family="'Consolas',monospace">EasyOCR fallback</text>
    <text x="287" y="215" font-size="11" fill="#8fb8e0" font-family="'Consolas',monospace">MiniLM-L6-v2 embed</text>

    <line x1="460" y1="194" x2="476" y2="194" stroke="#4fd6ff" stroke-width="2.2" marker-end="url(#arrowC)"/>

    <!-- Node: ChromaDB -->
    <rect x="478" y="158" width="180" height="72" rx="12" fill="url(#chipFace)" stroke="#2f6ec2" stroke-width="1.6"/>
    <path d="M496 178 a10 5 0 1 0 20 0 a10 5 0 1 0 -20 0 M496 178 v14 a10 5 0 0 0 20 0 v-14" fill="none" stroke="#7fc9ff" stroke-width="1.6"/>
    <text x="528" y="182" font-size="14.5" font-weight="700" fill="#eaf5ff">ChromaDB</text>
    <text x="528" y="200" font-size="11" fill="#8fb8e0" font-family="'Consolas',monospace">vector store</text>
    <text x="528" y="215" font-size="11" fill="#8fb8e0" font-family="'Consolas',monospace">local disk only</text>

    <!-- vertical connector down to router -->
    <line x1="568" y1="230" x2="568" y2="268" stroke="#4fd6ff" stroke-width="2" opacity="0.7"/>
    <circle cx="568" cy="268" r="3.5" fill="#4fd6ff"/>

    <!-- Node: Your Question -->
    <rect x="56" y="300" width="176" height="72" rx="12" fill="url(#greenFace)" stroke="#3fae66" stroke-width="1.6"/>
    <path d="M76 320 h30 M76 330 h30 M76 340 h18" stroke="#8fe3a8" stroke-width="1.6"/>
    <text x="112" y="326" font-size="15.5" font-weight="700" fill="#eafff0">Your Question</text>
    <text x="112" y="344" font-size="11.5" fill="#8fd6a8" font-family="'Consolas',monospace">natural language, typed</text>
    <text x="112" y="358" font-size="11.5" fill="#8fd6a8" font-family="'Consolas',monospace">no query syntax needed</text>

    <line x1="232" y1="336" x2="270" y2="336" stroke="#5be08a" stroke-width="2.2" marker-end="url(#arrowG)"/>

    <!-- Node: Router -->
    <rect x="275" y="300" width="190" height="72" rx="12" fill="url(#greenFace)" stroke="#3fae66" stroke-width="1.6"/>
    <path d="M300 320 l12 8 -12 8 M300 328 h20" stroke="#8fe3a8" stroke-width="1.6" fill="none"/>
    <text x="330" y="326" font-size="14.5" font-weight="700" fill="#eafff0">Router</text>
    <text x="330" y="344" font-size="11" fill="#8fd6a8" font-family="'Consolas',monospace">deterministic logic</text>
    <text x="330" y="358" font-size="11" fill="#8fd6a8" font-family="'Consolas',monospace">no LLM guessing</text>

    <!-- branch to semantic search / text-to-sql -->
    <line x1="465" y1="336" x2="500" y2="292" stroke="#5be08a" stroke-width="2.2" marker-end="url(#arrowG)"/>
    <line x1="465" y1="336" x2="500" y2="380" stroke="#5be08a" stroke-width="2.2" marker-end="url(#arrowG)"/>

    <rect x="505" y="262" width="200" height="60" rx="12" fill="url(#greenFace)" stroke="#3fae66" stroke-width="1.6"/>
    <text x="528" y="288" font-size="13.5" font-weight="700" fill="#eafff0">Semantic Search</text>
    <text x="528" y="304" font-size="10.5" fill="#8fd6a8" font-family="'Consolas',monospace">carrier/vendor isolation</text>

    <rect x="505" y="352" width="200" height="60" rx="12" fill="url(#greenFace)" stroke="#3fae66" stroke-width="1.6"/>
    <text x="528" y="378" font-size="13.5" font-weight="700" fill="#eafff0">Text-to-SQL</text>
    <text x="528" y="394" font-size="10.5" fill="#8fd6a8" font-family="'Consolas',monospace">self-corrects on bad query</text>

    <line x1="705" y1="292" x2="748" y2="310" stroke="#5be08a" stroke-width="2.2" marker-end="url(#arrowG)"/>
    <line x1="705" y1="382" x2="748" y2="330" stroke="#5be08a" stroke-width="2.2" marker-end="url(#arrowG)"/>

    <!-- Node: Local LLM -->
    <rect x="753" y="288" width="196" height="64" rx="12" fill="url(#amberFace)" stroke="#c99a3f" stroke-width="1.6"/>
    <rect x="768" y="304" width="14" height="14" fill="none" stroke="#ffd68a" stroke-width="1.4"/>
    <path d="M775 300 v4 M775 318 v4 M768 311 h-4 M782 311 h4" stroke="#ffd68a" stroke-width="1.3"/>
    <text x="792" y="314" font-size="14" font-weight="700" fill="#fff2da">Local LLM</text>
    <text x="792" y="330" font-size="10.5" fill="#e0c088" font-family="'Consolas',monospace">Llama 3.2 via Ollama</text>
    <text x="792" y="343" font-size="10.5" fill="#e0c088" font-family="'Consolas',monospace">auto-retry on fail</text>

    <line x1="949" y1="320" x2="964" y2="320" stroke="#ffcf6a" stroke-width="2.2" marker-end="url(#arrowG)"/>

    <!-- Node: Cited Answer -->
    <rect x="969" y="288" width="180" height="64" rx="12" fill="#33131c" stroke="#c9506a" stroke-width="1.6"/>
    <path d="M985 306 l6 6 -6 6 M985 312 h14" stroke="#ff9fb3" stroke-width="1.5" fill="none"/>
    <text x="1006" y="314" font-size="14" font-weight="700" fill="#ffe3ea">Cited Answer</text>
    <text x="1006" y="330" font-size="10.5" fill="#e39cad" font-family="'Consolas',monospace">[source.pdf, page N]</text>
    <text x="1006" y="343" font-size="10.5" fill="#e39cad" font-family="'Consolas',monospace">verifiable, not a guess</text>
  </g>

  <!-- ===================== Divider ===================== -->
  <line x1="56" y1="440" x2="1144" y2="440" stroke="#1c3a66" stroke-width="1"/>

  <!-- ===================== Stat strip ===================== -->
  <g font-family="'Segoe UI', Arial, sans-serif">
    <text x="56" y="470" font-family="'Consolas',monospace" font-size="12" fill="#4fd6ff" letter-spacing="1.2">// WHY THIS EXISTS</text>

    <text x="56" y="500" font-size="15.5" font-weight="700" fill="#ffffff">Zero cloud exposure</text>
    <text x="56" y="521" font-size="12" fill="#9fb3d1">Runs fully on-device, nothing leaves it</text>

    <text x="328" y="500" font-size="15.5" font-weight="700" fill="#ffffff">3 input types, 1 pipeline</text>
    <text x="328" y="521" font-size="12" fill="#9fb3d1">Text, tables, and OCR'd screenshots</text>

    <text x="600" y="500" font-size="15.5" font-weight="700" fill="#ffffff">Asks, doesn't guess</text>
    <text x="600" y="521" font-size="12" fill="#9fb3d1">Clarifies instead of guessing</text>

    <text x="872" y="500" font-size="15.5" font-weight="700" fill="#ffffff">Fully open source</text>
    <text x="872" y="521" font-size="12" fill="#9fb3d1">Every config point documented</text>
  </g>

  <!-- ===================== Tech stack chips ===================== -->
  <g font-family="'Consolas', 'SF Mono', monospace" font-size="12" font-weight="600">
    <rect x="56" y="558" width="76" height="28" rx="14" fill="#0c1d3d" stroke="#2f6ec2" stroke-width="1"/>
    <text x="94" y="576" fill="#bfe3ff" text-anchor="middle">Python</text>

    <rect x="140" y="558" width="82" height="28" rx="14" fill="#0c1d3d" stroke="#2f6ec2" stroke-width="1"/>
    <text x="181" y="576" fill="#bfe3ff" text-anchor="middle">FastAPI</text>

    <rect x="230" y="558" width="96" height="28" rx="14" fill="#0c1d3d" stroke="#2f6ec2" stroke-width="1"/>
    <text x="278" y="576" fill="#bfe3ff" text-anchor="middle">ChromaDB</text>

    <rect x="334" y="558" width="150" height="28" rx="14" fill="#0c1d3d" stroke="#2f6ec2" stroke-width="1"/>
    <text x="409" y="576" fill="#bfe3ff" text-anchor="middle">sentence-transformers</text>

    <rect x="492" y="558" width="130" height="28" rx="14" fill="#0c1d3d" stroke="#2f6ec2" stroke-width="1"/>
    <text x="557" y="576" fill="#bfe3ff" text-anchor="middle">Ollama / Llama 3.2</text>

    <rect x="630" y="558" width="82" height="28" rx="14" fill="#0c1d3d" stroke="#2f6ec2" stroke-width="1"/>
    <text x="671" y="576" fill="#bfe3ff" text-anchor="middle">SQLite</text>

    <rect x="720" y="558" width="88" height="28" rx="14" fill="#0c1d3d" stroke="#2f6ec2" stroke-width="1"/>
    <text x="764" y="576" fill="#bfe3ff" text-anchor="middle">EasyOCR</text>

    <rect x="816" y="558" width="98" height="28" rx="14" fill="#0c1d3d" stroke="#2f6ec2" stroke-width="1"/>
    <text x="865" y="576" fill="#bfe3ff" text-anchor="middle">PyMuPDF</text>
  </g>
</svg>
